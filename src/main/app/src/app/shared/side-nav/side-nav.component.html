<mat-nav-list
  [@sideNavToggle]="menuState()"
  (mouseenter)="mouseEnter()"
  (mouseleave)="mouseLeave()"
>
  <ng-container *ngFor="let menuItem of menu()" [ngSwitch]="menuItem.type">
    <h3 mat-subheader *ngSwitchCase="menuItemType.HEADER">
      <mat-icon *ngIf="menuState() === MenuState.CLOSED">{{
        menuItem.icon ?? "more_horiz"
      }}</mat-icon>
      <span *ngIf="menuState() === MenuState.OPEN">
        {{ menuItem.title | translate }}</span
      >
    </h3>
    <mat-divider *ngSwitchCase="menuItemType.HEADER" />
    <a
      mat-list-item
      *ngSwitchCase="menuItemType.LINK"
      [disabled]="menuItem.disabled"
      [activated]="menuItem.activated"
      routerLink="{{ asLinkMenuItem(menuItem).url }}"
      routerLinkActive="active"
    >
      <mat-icon
        [matTooltipDisabled]="menuState() === MenuState.OPEN"
        matTooltipPosition="after"
        [matTooltip]="menuItem.title | translate"
        matListItemIcon
        >{{ menuItem.icon }}</mat-icon
      >
      <div matListItemTitle>{{ menuItem.title | translate }}</div>
    </a>
    <ng-container *ngSwitchCase="menuItemType.BUTTON">
      <ng-template #buttonMenuItem>
        <button
          mat-list-item
          [disabled]="menuItem.disabled"
          [activated]="activeItem() === menuItem.title"
          (click)="onClick(asButtonMenuItem(menuItem))"
          routerLinkActive="active"
        >
          <mat-icon
            [matTooltipDisabled]="menuState() === MenuState.OPEN"
            matTooltipPosition="after"
            [matTooltip]="menuItem.title | translate"
            matListItemIcon
            >{{ menuItem.icon }}</mat-icon
          >
          <div matListItemTitle>{{ menuItem.title | translate }}</div>
        </button>
      </ng-template>
      <!-- A disabled button receives no mouse or keyboard events, so its explanation hangs on a focusable wrapper -->
      <span
        *ngIf="menuItem.tooltip; else buttonMenuItem"
        class="explained-menu-item"
        role="group"
        tabindex="0"
        [attr.aria-label]="menuItem.title | translate"
        [matTooltip]="menuItem.tooltip | translate"
        matTooltipPosition="after"
      >
        <ng-container *ngTemplateOutlet="buttonMenuItem" />
      </span>
    </ng-container>
    <a
      mat-list-item
      *ngSwitchCase="menuItemType.HREF"
      [disabled]="menuItem.disabled"
      [href]="asHrefMenuItem(menuItem).url"
    >
      <mat-icon
        [matTooltipDisabled]="menuState() === MenuState.OPEN"
        matTooltipPosition="after"
        [matTooltip]="menuItem.title | translate"
        matListItemIcon
        >{{ menuItem.icon }}</mat-icon
      >
      <div matListItemTitle>{{ menuItem.title | translate }}</div>
    </a>
  </ng-container>
</mat-nav-list>
<mat-toolbar class="toolbar-footer">
  <button
    (click)="toggleMenu()"
    mat-mini-fab
    id="toggleMenuButon"
    title="{{ 'actie.menu.aanpassen' | translate }}"
  >
    <mat-icon [@rotated180]="menuMode">{{
      menuMode === MenuMode.AUTO ? "menu" : "menu_open"
    }}</mat-icon>
  </button>
</mat-toolbar>
